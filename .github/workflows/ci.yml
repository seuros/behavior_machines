name: CI

on:
  push:
    branches:
      - master

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust crate and the binding, independently of the gem
  test-rust-crate:
    runs-on: ubuntu-latest
    name: Rust Crate Tests
    env:
      CARGO_BUILD_WARNINGS: deny

    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Run Rust tests
        run: |
          echo "::group::Running Rust tests"
          time cargo test -p behavior-machines
          time cargo test -p behavior-machines --all-features
          time cargo test -p behavior-machines-circuit
          cargo run -p behavior-machines-circuit --example inference
          echo "::endgroup::"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build for a no_std target
        run: |
          cargo build -p behavior-machines --target thumbv7em-none-eabihf --all-features
          cargo build -p behavior-machines-circuit --target thumbv7em-none-eabihf

      - name: Check crate can be published
        run: |
          cd ext/behavior_machines_native/core
          cargo package --allow-dirty

  # Pure Ruby backend (no native extension)
  test-ruby:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} (Pure Ruby)
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    env:
      MISE_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby }}-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run tests (Pure Ruby)
        run: |
          echo "::group::Running tests with Pure Ruby backend"
          time bundle exec rake test TESTOPTS=--coverage
          echo "::endgroup::"

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage.md') != ''
        run: cat coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pure Ruby mode
        run: |
          bundle exec ruby -Ilib -e "
            require 'behavior_machines'
            if BehaviorMachines.native_available?
              puts '❌ ERROR: Native extension should not be available'
              exit 1
            else
              puts '✅ Pure Ruby backend active'
            end
          "

  # Native backend, including the side-by-side parity tests
  test-native:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} (Native)
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    env:
      MISE_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.toml') }}

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby }}-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Build native extension
        run: |
          echo "::group::Building native extension"
          bundle exec rake compile
          echo "::endgroup::"

      - name: Run tests (Native)
        env:
          # Native is opt-in; padded_cell's workers inherit the environment.
          BEHAVIOR_MACHINES_NATIVE: "1"
        run: |
          echo "::group::Running tests with the native backend"
          time bundle exec rake test
          echo "::endgroup::"

      - name: Verify native mode
        env:
          BEHAVIOR_MACHINES_NATIVE: "1"
        run: |
          bundle exec ruby -Ilib -e "
            require 'behavior_machines'
            if BehaviorMachines.native_available?
              puts '✅ Native backend active'
            else
              puts '❌ ERROR: Native extension should be available'
              exit 1
            end
          "
