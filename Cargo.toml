[workspace]
members = [
    "ext/behavior_machines_native/circuit",
    "ext/behavior_machines_native/core",
    "ext/behavior_machines_native/ffi",
]
default-members = [
    "ext/behavior_machines_native/circuit",
    "ext/behavior_machines_native/core",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/seuros/behavior_machines"

[workspace.dependencies]
behavior-machines = { path = "ext/behavior_machines_native/core", version = ">=0.3.1" }
state-machines = { version = ">=0.34", default-features = false }
matryona-machines = { version = ">=0.5", default-features = false }
magnus = { version = "0.9.3", default-features = false }
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys ships no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and its
# default-features = false drops the default that would have supplied it, so
# dropping this line breaks the build on every Ruby newer than rb-sys.
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
