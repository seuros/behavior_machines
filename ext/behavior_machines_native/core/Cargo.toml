[package]
name = "behavior-machines"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Behavior trees with explicit halt semantics: no_std, allocation-free, composes the state_machines ecosystem"
keywords = ["behavior-tree", "ai", "no-std", "workflow", "state-machine"]
categories = ["no-std", "algorithms", "game-development"]
readme = "README.md"
exclude = ["src/**/tests.rs", "src/test_support.rs", "tests/"]

[features]
# The nested `Node` builder and `HeapTree`, which allocate while building.
# The inline `Tree` never does.
alloc = []
# Leaves that drive a state-machines dynamic machine (`machine` module).
state-machines = ["dep:state-machines"]

[dependencies]
state-machines = { workspace = true, optional = true }

[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
