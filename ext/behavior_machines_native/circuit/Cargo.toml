[package]
name = "behavior-machines-circuit"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiles a behavior-machines tree into a branchless arithmetic circuit: one layered sparse matmul per tick instead of a recursive tree walk"
keywords = ["behavior-tree", "no-std", "compiler", "branchless", "differentiable"]
categories = ["no-std", "algorithms", "game-development"]
readme = "README.md"
exclude = ["src/**/tests.rs", "src/test_support.rs", "tests/"]

[dependencies]
behavior-machines.workspace = true

[dev-dependencies]
behavior-machines = { workspace = true, features = ["alloc"] }
matryona-machines = { workspace = true, features = ["testing"] }

[lints]
workspace = true
