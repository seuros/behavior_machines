[package]
name = "behavior-machines-circuit"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-3-Clause"
repository = "https://github.com/seuros/behavior_machines"
description = "Compiles a behavior-machines tree into a branchless arithmetic circuit: one layered sparse matmul per tick instead of a recursive tree walk"
keywords = ["behavior-tree", "no-std", "compiler", "branchless", "differentiable"]
categories = ["no-std", "algorithms", "game-development"]
readme = "README.md"

[dependencies]
behavior-machines = { path = "../core", version = "0.2.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

[lints]
workspace = true
